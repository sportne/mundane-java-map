plugins {
    id 'groovy-gradle-plugin'
    id 'checkstyle'
    id 'jacoco'
}

def testJavaVersion =
        providers.gradleProperty('map.testJavaVersion').map(Integer::parseInt).getOrElse(21)
if (testJavaVersion < 21) {
    throw new GradleException(
            "map.testJavaVersion must be 21 or newer; received ${testJavaVersion}")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Javadoc).configureEach {
    source = fileTree('src/main/java')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
    options.addBooleanOption('notimestamp', true)
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configDirectory = rootProject.file('../config/checkstyle')
    sourceSets = [sourceSets.main, sourceSets.test]
}

configurations {
    functionalJacocoAgent {
        canBeConsumed = false
        transitive = false
    }
}

tasks.named('checkstyleMain') {
    source = fileTree('src/main/java')
}

tasks.named('checkstyleTest') {
    source = fileTree('src/test/java')
}

def publicApiCheck = tasks.register('checkstylePublicApi', Checkstyle) {
    group = 'verification'
    description = 'Checks build-support public declarations for complete API documentation.'
    source = fileTree('src/main/java')
    classpath = files()
    configFile = rootProject.file('../config/checkstyle/checkstyle-public-api.xml')
}

tasks.named('check') {
    dependsOn publicApiCheck
}

def buildLogicPluginMarkers = [
    [id: 'com.diffplug.spotless', version: libs.versions.spotlessPlugin.get(),
        implementation: 'com.diffplug.spotless:spotless-plugin-gradle'],
    [id: 'com.github.spotbugs', version: libs.versions.spotbugsPlugin.get(),
        implementation: 'com.github.spotbugs.snom:spotbugs-gradle-plugin'],
    [id: 'net.ltgt.errorprone', version: libs.versions.errorpronePlugin.get(),
        implementation: 'net.ltgt.gradle:gradle-errorprone-plugin'],
    [id: 'org.graalvm.buildtools.native', version: libs.versions.graalvmNativePlugin.get(),
        implementation: 'org.graalvm.buildtools:native-gradle-plugin']
]

dependencies {
    buildLogicPluginMarkers.each { marker ->
    implementation "${marker.id}:${marker.id}.gradle.plugin:${marker.version}"
    }
    implementation "org.jacoco:org.jacoco.core:${libs.versions.jacoco.get()}"
    testImplementation gradleTestKit()
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    functionalJacocoAgent(
            "org.jacoco:org.jacoco.agent:${libs.versions.jacoco.get()}:runtime")
}

def functionalJacocoAgentFiles = configurations.functionalJacocoAgent
def functionalJacocoDestination = layout.buildDirectory.file('jacoco/functional.exec')

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion)
    }
    useJUnitPlatform()
    systemProperty 'map.rootDir', rootDir.parentFile.absolutePath
    systemProperty 'map.functionalJacocoDestination',
            functionalJacocoDestination.get().asFile.absolutePath
    inputs.files(functionalJacocoAgentFiles)
    outputs.file(functionalJacocoDestination)
    doFirst {
        java.nio.file.Files.deleteIfExists(functionalJacocoDestination.get().asFile.toPath())
        systemProperty 'map.functionalJacocoAgent',
                functionalJacocoAgentFiles.singleFile.absolutePath
    }
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    executionData.from(
            layout.buildDirectory.file('jacoco/test.exec'),
            functionalJacocoDestination)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    executionData.from(
            layout.buildDirectory.file('jacoco/test.exec'),
            functionalJacocoDestination)
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

def generatedCoverageSources = [
    'MundaneMapArchitectureTestConventionsPlugin.java',
    'MundaneMapJavaApplicationConventionsPlugin.java',
    'MundaneMapJavaLibraryConventionsPlugin.java',
    'MundaneMapNativeImageConventionsPlugin.java',
    'MundaneMapPublishingConventionsPlugin.java',
    'MundaneMapRootConventionsPlugin.java'
]
def buildLogicCoverageAliases = [:]
[
    'ArchitectureTest',
    'JavaApplication',
    'JavaLibrary',
    'NativeImage',
    'Publishing',
    'Root'
].each { name ->
    String physical = "mundane-map.${name.replaceAll(/([A-Z])/, '-$1').toLowerCase().substring(1)}-conventions.gradle"
    buildLogicCoverageAliases["precompiled_MundaneMap${name}Conventions"] = physical
    buildLogicCoverageAliases["cp_precompiled_MundaneMap${name}Conventions"] = physical
}
def buildLogicClassDirectories = files(
        sourceSets.main.output.classesDirs,
        layout.buildDirectory.dir('groovy-dsl-plugins/output/plugin-classes'),
        layout.buildDirectory.dir('groovy-dsl-plugins/output/plugin-requests'))
def buildLogicCoverageArguments = [
    projectDir.absolutePath,
    layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
            .get().asFile.absolutePath,
    '0.80',
    ':build-logic',
    layout.buildDirectory.file('reports/jacoco/test/source-coverage.csv')
            .get().asFile.absolutePath,
    layout.buildDirectory.file('reports/jacoco/test/source-coverage.md')
            .get().asFile.absolutePath,
    generatedCoverageSources.size().toString()
] + generatedCoverageSources + [
    buildLogicCoverageAliases.size().toString()
] + buildLogicCoverageAliases.collectMany { key, value -> [key, value] } + [
    '1',
    layout.buildDirectory.dir('groovy-dsl-plugins/output/adapter-src')
            .get().asFile.absolutePath,
    buildLogicClassDirectories.files.size().toString()
] + buildLogicClassDirectories.files.collect { it.absolutePath } + [
    file('src/main/java').absolutePath,
    file('src/main/groovy').absolutePath
]

def verifyBuildLogicSourceCoverage = tasks.register(
        'verifyBuildLogicSourceCoverage',
        JavaExec) {
    group = 'verification'
    description = 'Verifies and reports per-source coverage for hand-authored build logic.'
    dependsOn tasks.named('jacocoTestReport')
    classpath = sourceSets.main.runtimeClasspath + configurations.compileClasspath
    mainClass = 'io.github.mundanej.map.buildlogic.VerifySourceFileCoverage'
    inputs.files(
            fileTree('src/main/java'),
            fileTree('src/main/groovy'),
            buildLogicClassDirectories,
            layout.buildDirectory.dir('groovy-dsl-plugins/output/adapter-src'),
            layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml'))
    outputs.files(
            layout.buildDirectory.file('reports/jacoco/test/source-coverage.csv'),
            layout.buildDirectory.file('reports/jacoco/test/source-coverage.md'))
    args buildLogicCoverageArguments
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn verifyBuildLogicSourceCoverage
}

def resolvedCoordinates = providers.provider {
    Map<String, Set<String>> coordinates = [:].withDefault { [] as Set }
    configurations.matching { it.canBeResolved }.each { configuration ->
        configuration.resolve()
        configuration.incoming.resolutionResult.allComponents.each { component ->
            if (component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                String owner =
                        "${component.id.group}:${component.id.module}:${component.id.version}"
                component.dependencies.each { dependency ->
                    if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult
                            && dependency.selected.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                        def selected = dependency.selected.id
                        coordinates[owner].add(
                                "${selected.group}:${selected.module}:${selected.version}")
                    }
                }
                coordinates[owner]
            }
        }
    }
    coordinates.collect { coordinate, dependencies ->
        "${coordinate}|${dependencies.sort().join(',')}"
    }.sort()
}

tasks.register('writeOfflineRepositoryCoordinates') {
    group = 'build setup'
    description = 'Writes the exact external component set resolved by build-logic.'
    def output = layout.buildDirectory.file('offline-repository/coordinates.txt')
    inputs.property('coordinates', resolvedCoordinates)
    outputs.file(output)
    doLast {
        File target = output.get().asFile
        target.parentFile.mkdirs()
        target.setText(resolvedCoordinates.get().join('\n') + '\n', 'UTF-8')
    }
}
