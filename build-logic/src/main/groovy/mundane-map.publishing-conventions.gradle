plugins {
    id 'maven-publish'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(rootProject.layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE' }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name.set(providers.provider { project.name })
                description.set(providers.provider { project.description ?: project.name })
                url.set('https://github.com/sportne/mundane-java-map')
                licenses {
                    license {
                        name = 'BSD 3-Clause License'
                        url = 'https://opensource.org/license/bsd-3-clause'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'sportne'
                    }
                }
                scm {
                    url = 'https://github.com/sportne/mundane-java-map'
                    connection = 'scm:git:https://github.com/sportne/mundane-java-map.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'releaseDryRun'
            url = rootProject.layout.buildDirectory.dir('release-dry-run/maven')
        }
    }
}
