plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
    id 'net.ltgt.errorprone'
}

def javaRelease = providers.gradleProperty('map.javaRelease').map(Integer::parseInt).getOrElse(21)
if (javaRelease != 21) {
    throw new GradleException(
            "map.javaRelease is fixed at 21; received ${javaRelease}")
}
def testJavaVersion =
        providers.gradleProperty('map.testJavaVersion').map(Integer::parseInt).getOrElse(21)
if (testJavaVersion < 21) {
    throw new GradleException(
            "map.testJavaVersion must be 21 or newer; received ${testJavaVersion}")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
    options.addBooleanOption('notimestamp', true)
}

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    errorprone libs.errorprone.core
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    options.errorprone.disableWarningsInGeneratedCode.set(true)
}

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(testJavaVersion)
    }
    systemProperty 'map.testJavaVersion', testJavaVersion
    useJUnitPlatform {
        excludeTags 'slow', 'native-image', 'manual'
    }
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configDirectory = rootProject.file('config/checkstyle')
    sourceSets = [sourceSets.main, sourceSets.test]
}

def publicApiCheck = tasks.register('checkstylePublicApi', Checkstyle) {
    group = 'verification'
    description = 'Checks main-source public declarations for complete API documentation.'
    source = sourceSets.main.allJava
    classpath = files()
    configFile = rootProject.file('config/checkstyle/checkstyle-public-api.xml')
}

tasks.named('check') {
    dependsOn publicApiCheck
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat().aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target '*.gradle', 'src/**/*.gradle'
        greclipse()
        leadingTabsToSpaces(4)
    }
}

spotbugs {
    toolVersion = libs.versions.spotbugs.get()
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    runOnCheck = false
}

tasks.named('check') {
    dependsOn tasks.named('spotbugsMain')
    dependsOn tasks.named('spotbugsTest')
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('test') {
    if (testJavaVersion == javaRelease) {
        finalizedBy tasks.named('jacocoTestReport')
    } else {
        extensions.getByType(
                org.gradle.testing.jacoco.plugins.JacocoTaskExtension).enabled = false
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

def verifySourceFileCoverage = tasks.register(
        'verifySourceFileCoverage',
        io.github.mundanej.map.buildlogic.VerifySourceFileCoverage) {
    group = 'verification'
    description = 'Verifies and reports instruction coverage for every production source file.'
    dependsOn tasks.named('jacocoTestReport')
    projectDirectory = layout.projectDirectory
    sourceDirectories.from(sourceSets.main.java.srcDirs)
    compiledClassDirectories.from(sourceSets.main.output.classesDirs)
    generatedSourceDirectories.from(layout.buildDirectory.dir('generated'))
    xmlReport = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
    generatedSourceKeys = []
    sourceAliases = [:]
    minimum = 0.80
    projectIdentity = project.path
    csvReport = layout.buildDirectory.file('reports/jacoco/test/source-coverage.csv')
    markdownReport = layout.buildDirectory.file('reports/jacoco/test/source-coverage.md')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn verifySourceFileCoverage
}
