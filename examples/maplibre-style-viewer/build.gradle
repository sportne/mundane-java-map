plugins {
    id 'mundane-map.java-application-conventions'
}

dependencies {
    implementation project(':modules:mundane-map-api')
    implementation project(':modules:mundane-map-core')
    implementation project(':modules:mundane-map-awt')
    implementation project(':modules:mundane-map-io-maplibre-style-jackson')
}

application {
    mainClass = 'io.github.mundanej.map.example.maplibre.MapLibreStyleViewer'
}

description = 'Runnable bounded MapLibre literal-vector-style example.'
