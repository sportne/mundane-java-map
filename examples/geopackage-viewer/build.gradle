plugins {
    id 'mundane-map.java-application-conventions'
}

dependencies {
    implementation project(':modules:mundane-map-api')
    implementation project(':modules:mundane-map-core')
    implementation project(':modules:mundane-map-awt')
    implementation project(':modules:mundane-map-io-geopackage-xerial')
}

application {
    mainClass = 'io.github.mundanej.map.example.geopackage.GeoPackageViewer'
}

description = 'Runnable bounded GeoPackage feature and tile viewer example.'
