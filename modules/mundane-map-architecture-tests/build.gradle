@DisableCachingByDefault(because = 'Writes an explicitly reviewed dependency profile')
abstract class WriteArtifactProfile extends DefaultTask {
    @Input
    abstract Property<Boolean> getApproved()

    @Input
    abstract ListProperty<String> getCoordinates()

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getArtifacts()

    @OutputFile
    abstract org.gradle.api.file.RegularFileProperty getProfile()

    @TaskAction
    void writeProfile() {
        if (!approved.get()) {
            throw new GradleException(
            'writeRevapiProfile requires -Pmap.approveRevapiProfile=true')
        }
        profile.get().asFile.text = profileRows(coordinates.get(), artifacts.files).join('\n') + '\n'
    }

    static List<String> profileRows(List<String> coordinates, Set<File> artifacts) {
        Map<String, String> coordinateByFile = coordinates.collectEntries { row ->
            String[] fields = row.split('\t', -1)
            [(fields[1]): fields[0]]
        }
        List<String> rows = ['coordinate\tfile\tsha256']
        artifacts.sort { it.name }.each { artifact ->
            String coordinate = coordinateByFile.get(artifact.name)
            if (coordinate == null) {
                throw new GradleException('Missing coordinate for ' + artifact.name)
            }
            rows.add(coordinate + '\t' + artifact.name + '\t'
                    + java.security.MessageDigest.getInstance('SHA-256')
                    .digest(artifact.bytes).encodeHex().toString())
        }
        rows.sort { left, right ->
            left.startsWith('coordinate\t') ? -1
                    : right.startsWith('coordinate\t') ? 1 : left <=> right
        }
        rows
    }
}

@DisableCachingByDefault(because = 'Verifies an explicitly reviewed dependency profile')
abstract class VerifyArtifactProfile extends DefaultTask {
    @Input
    abstract ListProperty<String> getCoordinates()

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getArtifacts()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract org.gradle.api.file.RegularFileProperty getProfile()

    @TaskAction
    void verifyProfile() {
        List<String> actual = WriteArtifactProfile.profileRows(coordinates.get(), artifacts.files)
        List<String> expected = profile.get().asFile.readLines()
        if (actual != expected) {
            throw new GradleException(
            'Revapi artifact profile changed; review licenses, checksums, and '
            + 'synthetic classifications before updating '
            + profile.get().asFile)
        }
    }
}

def revapiArtifacts = configurations.revapiAnalysis.incoming.artifactView { }.artifacts
def revapiCoordinates = revapiArtifacts.resolvedArtifacts.map { artifacts ->
    artifacts.collect { artifact ->
        def identifier = artifact.id.componentIdentifier
        if (!(identifier instanceof ModuleComponentIdentifier)) {
            throw new GradleException('Revapi profile contains a non-module artifact: ' + identifier)
        }
        "${identifier.group}:${identifier.module}:${identifier.version}\t${artifact.file.name}"
    }.sort()
}

tasks.register('writeRevapiProfile', WriteArtifactProfile) {
    group = 'build setup'
    description = 'Writes the reviewed exact Revapi artifact profile when explicitly approved.'
    approved = providers.gradleProperty('map.approveRevapiProfile')
            .map { it.toBoolean() }.orElse(false)
    coordinates = revapiCoordinates
    artifacts.from revapiArtifacts.artifactFiles
    profile = revapiProfile
}

def verifyRevapiProfile = tasks.register('verifyRevapiProfile', VerifyArtifactProfile) {
    group = 'verification'
    description = 'Verifies the exact reviewed Revapi graph and artifact checksums.'
    coordinates = revapiCoordinates
    artifacts.from revapiArtifacts.artifactFiles
    profile = revapiProfile
}

@DisableCachingByDefault(because = 'Resolves and verifies production runtime classpaths')
abstract class VerifyRuntimeClasspath extends DefaultTask {
    @Input
    abstract Property<String> getModulePath()

    @Classpath
    abstract ConfigurableFileCollection getRuntimeClasspathFiles()

    @Classpath
    abstract ConfigurableFileCollection getAllowedProjectArtifacts()

    @TaskAction
    void verifyRuntime() {
        verifyFiles(
                modulePath.get(),
                runtimeClasspathFiles.files,
                allowedProjectArtifacts.files)
    }

    static void verifyFiles(
            String modulePath, Collection<File> runtimeFiles, Collection<File> allowedFiles) {
        Set<java.nio.file.Path> allowed = allowedFiles.collect {
            it.toPath().toAbsolutePath().normalize()
        } as Set
        Set<java.nio.file.Path> unexpected = runtimeFiles.collect {
            it.toPath().toAbsolutePath().normalize()
        }.findAll { !allowed.contains(it) } as Set
        if (!unexpected.isEmpty()) {
            throw new GradleException(
            "JDK-only runtime boundary violated by ${modulePath}: "
            + "${unexpected.sort()}")
        }
    }
}

@DisableCachingByDefault(because = 'Verifies declared production project dependency edges')
abstract class VerifyProjectDependencies extends DefaultTask {
    @Input
    abstract Property<String> getModulePath()

    @Input
    abstract SetProperty<String> getDeclaredProjectPaths()

    @Input
    abstract SetProperty<String> getAllowedProjectPaths()

    @TaskAction
    void verifyDependencies() {
        verifyEdges(modulePath.get(), declaredProjectPaths.get(), allowedProjectPaths.get())
    }

    static void verifyEdges(String modulePath, Set<String> declared, Set<String> allowed) {
        if (declared != allowed) {
            throw new GradleException(
            "Runtime project boundary violated by ${modulePath}: "
            + "declared ${declared.sort()}, allowed ${allowed.sort()}")
        }
    }
}

@DisableCachingByDefault(because = 'Proves runtime dependency rules reject invalid fixtures')
abstract class TestRuntimeClasspathRule extends DefaultTask {
    @TaskAction
    void verifyNegativeFixture() {
        File externalArtifact = new File(temporaryDir, 'external-adapter.jar')
        externalArtifact.bytes = []
        boolean runtimeRejected = false
        try {
            VerifyRuntimeClasspath.verifyFiles(
                    ':fixtures:level1', [externalArtifact], [])
        } catch (GradleException expected) {
            if (!expected.message.contains(':fixtures:level1')
                    || !expected.message.contains('external-adapter.jar')) {
                throw new GradleException(
                'Runtime dependency rule produced an unstable diagnostic', expected)
            }
            runtimeRejected = true
        }
        if (!runtimeRejected) {
            throw new GradleException('Runtime dependency rule accepted an external artifact')
        }
        boolean projectEdgeRejected = false
        try {
            VerifyProjectDependencies.verifyEdges(
                    ':fixtures:io', [':modules:mundane-map-awt'] as Set, [] as Set)
        } catch (GradleException expected) {
            if (!expected.message.contains(':fixtures:io')
                    || !expected.message.contains(':modules:mundane-map-awt')) {
                throw new GradleException(
                'Project dependency rule produced an unstable diagnostic', expected)
            }
            projectEdgeRejected = true
        }
        if (!projectEdgeRejected) {
            throw new GradleException(
            'Project dependency rule accepted an undeclared project edge')
        }
    }
}

@DisableCachingByDefault(because = 'Verifies the native support build configuration')
abstract class VerifyNativeConfiguration extends DefaultTask {
    @Input
    abstract SetProperty<String> getRuntimeProjects()

    @Input
    abstract SetProperty<String> getExpectedRuntimeProjects()

    @Input
    abstract Property<Integer> getJavaLanguageVersion()

    @TaskAction
    void verifyConfiguration() {
        if (runtimeProjects.get() != expectedRuntimeProjects.get()) {
            throw new GradleException(
            "Native support dependencies: expected ${expectedRuntimeProjects.get().sort()}, "
            + "found ${runtimeProjects.get().sort()}")
        }
        if (javaLanguageVersion.get() != 21) {
            throw new GradleException(
            "Native support Java toolchain changed to ${javaLanguageVersion.get()}")
        }
    }
}

def runtimeVerificationTasks = level1Inventory.collect { entry ->
    def targetProject = project(entry.path)
    targetProject.tasks.register(
            'verifyJdkOnlyRuntimeArchitecture', VerifyRuntimeClasspath) {
                group = 'verification'
                description = "Verifies the JDK-only runtime graph for ${entry.path}."
                modulePath = entry.path
                runtimeClasspathFiles.from(targetProject.configurations.runtimeClasspath)
                allowedProjectArtifacts.from(entry.allowedRuntimeProjects.collect { allowedPath ->
                    project(allowedPath).tasks.named('jar')
                })
            }
}

def projectDependencyVerificationTasks = productionInventory.collect { entry ->
    def targetProject = project(entry.path)
    targetProject.tasks.register(
            'verifyDeclaredRuntimeArchitecture', VerifyProjectDependencies) {
                group = 'verification'
                description = "Verifies declared production project edges for ${entry.path}."
                modulePath = entry.path
                declaredProjectPaths.set(providers.provider {
                    targetProject.configurations.runtimeClasspath.allDependencies
                            .withType(ProjectDependency)
                            .collect { dependency -> dependency.path } as Set
                })
                allowedProjectPaths.set(entry.allowedRuntimeProjects as Set)
            }
}

